version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      react-security:
        applies-to: security-updates
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      oxc:
        patterns: [oxlint, oxlint-tsgolint, oxfmt]
      tailwind:
        patterns: [tailwindcss, "@tailwindcss/*", tw-animate-css, tailwind-merge]
      vite:
        patterns: [vite, "@vitejs/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
